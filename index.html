<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(Beta) Codet Code App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121214; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #202024; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 400px; }
        h1 { color: #4ade80; margin-top: 0; }
        button { background: #4ade80; color: #121214; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 15px; }
        button:hover { background: #22c55e; }
        
        /* Pop-up Install Confirmation Modal styling */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal { background: #2a2a30; padding: 24px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .modal-buttons { display: flex; justify-content: space-around; margin-top: 20px; }
        .btn-confirm { background: #4ade80; color: #121214; }
        .btn-cancel { background: #a1a1aa; color: #121214; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Codet Code App (Beta) </h1>
        <p>Click below to open the install confirmation pop-up and add this app to your launcher (Please note that this is very much in beta, so please expect some bugs!).</p>
        <button id="installBtn">Install App</button>
        <button id="closeBtn" onclick="window.close()" style="display: none; background: #ef4444; color: white;">Close Application</button>
    </div>

    <!-- Custom Pop-up Install Confirmation Modal -->
    <div id="installModal" class="modal-overlay">
        <div class="modal">
            <h3>Install Codet Code?</h3>
            <p>Would you like to add this application to your device?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelModalBtn">No and Cancel</button>
                <button class="btn-confirm" id="confirmModalBtn">Yes and Install</button>
            </div>
        </div>
    </div>
<script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const closeBtn = document.getElementById('closeBtn');
    const installModal = document.getElementById('installModal');
    const confirmModalBtn = document.getElementById('confirmModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');

    // Show close button if already installed
    if (window.matchMedia('(display-mode: standalone)').matches) {
        closeBtn.style.display = 'inline-block';
        installBtn.style.display = 'none'; // Hide install button if already installed
    }

    // Capture the install prompt if the system triggers it
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    // Make your custom modal open when clicking the button
    installBtn.addEventListener('click', () => {
        installModal.style.display = 'flex';
    });

    cancelModalBtn.addEventListener('click', () => {
        installModal.style.display = 'none';
    });

    confirmModalBtn.addEventListener('click', async () => {
        installModal.style.display = 'none';
        
        if (deferredPrompt) {
            // Modern native install
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        } else {
            // BACKUP METHOD: If ChromeOS blocks the script, we give the user manual instructions!
            alert("To install this app on your Chromebook:\n\n1. Look at the top right of your browser's address bar.\n2. Click the small laptop icon with the down arrow (or click the three vertical dots menu and select 'Install App').");
        }
    });

    // Register Service Worker securely
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(reg => console.log("SW Registered!"))
        .catch(err => console.log("SW Error", err));
    }
</script>
</body>
</html>
